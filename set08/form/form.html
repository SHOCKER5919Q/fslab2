<!DOCTYPE html>
<html>
<body>
  <h2>Welcome Form</h2>

  <input type="text" id="name" placeholder="Enter your name">
  <button onclick="show()">Submit</button>

  <h3 id="msg"></h3>

  <script>
    function show() {
      const name = document.getElementById('name').value;
      document.getElementById('msg').innerText = 'Welcome, ' + name + '!';
    }
  </script>
</body>
</html>
